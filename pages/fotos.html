    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
      <span class="close" onclick="closeLightbox()">&times;</span>
      <img id="lightbox-image" src="" alt="Imagen en grande">
      <span class="nav prev" onclick="changeImage(-1)">&#10094;</span>
      <span class="nav next" onclick="changeImage(1)">&#10095;</span>
    </div>

    <script>
      var images = [
        "/images/IMG_3883.JPG",
        "/images/IMG_3873.JPG",
        "/images/Copia de Cami-3.jpg",
        "/images/IMG_4436.JPG",
        "/images/_DSC0040.JPEG",
        "/images/CMB08343-Mejorado-NR.jpeg",
        "/images/CMB08309.jpeg",
        "/images/IMG_3703.png"
      ];

      var currentIndex = 0;

      function openLightbox(index) {
        currentIndex = index;
        document.getElementById('lightbox-image').src = images[currentIndex];
        document.getElementById('lightbox').style.display = 'flex';
      }

      function closeLightbox() {
        document.getElementById('lightbox').style.display = 'none';
      }

      function changeImage(direction) {
        currentIndex += direction;
        if (currentIndex < 0) {
          currentIndex = images.length - 1;
        } else if (currentIndex >= images.length) {
          currentIndex = 0;
        }
        document.getElementById('lightbox-image').src = images[currentIndex];
      }
    </script>
