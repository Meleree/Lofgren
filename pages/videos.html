    <script src="/js/dark-mode.js"></script>
    <script>
      // Función para abrir el lightbox
      function openLightbox(videoId) {
        const lightbox = document.getElementById('video-lightbox');
        const iframe = document.getElementById('lightbox-video');
        
        // Cambiar la URL del iframe al video que fue clickeado
        iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1`;
        
        // Mostrar el lightbox
        lightbox.style.display = 'flex';
      }

      // Función para cerrar el lightbox
      function closeLightbox() {
        const lightbox = document.getElementById('video-lightbox');
        const iframe = document.getElementById('lightbox-video');
        
        // Detener el video al cerrar el lightbox (limpiar el iframe)
        iframe.src = '';
        
        // Ocultar el lightbox
        lightbox.style.display = 'none';
      }

      // Agregar eventos a los videos
      const videoIframes = document.querySelectorAll('.video-iframe');
      videoIframes.forEach(iframe => {
        iframe.addEventListener('click', function() {
          const videoId = this.getAttribute('data-video-id');
          openLightbox(videoId);
        });
      });

      // Agregar evento para cerrar el lightbox
      document.getElementById('close-lightbox').addEventListener('click', closeLightbox);
    </script>

    <!-- Contenedor Lightbox (oculto por defecto) -->
    <div id="video-lightbox" class="lightbox">
      <div class="lightbox-content">
        <button id="close-lightbox" class="close">X</button>
        <iframe id="lightbox-video" width="100%" height="100%" frameborder="0" allowfullscreen></iframe>
      </div>
